metadata:
  profile_type: "public_research"
  notice_name: "공공연구기관 직무발명·기술이전 규정"
  notice_id: "기관 직무발명·기술이전 규정"
  effective_date: "기관 규정 시행일 입력"
  parent_regulation: "기술의 이전 및 사업화 촉진에 관한 법률, 발명진흥법, 국가연구개발혁신법, 기관 직무발명 규정"
  competent_authority: "소속 기관 기술이전 전담조직"

# 원문 대조 (2026-11-08): 발명진흥법 [법률 제21065호, 2025.10.01. 시행] 제12조·제13조(2024.2.6. 개정),
# 발명진흥법 시행령 [대통령령 제36563호, 2026.08.07. 시행] 제7조, 소득세법 시행령 제17조의3

verification_notes:
  - "기관 규정의 발명자 보상 비율을 disposal_compensation.payout_ratio에 입력하십시오 (null이면 호출 시 입력 필요)"
  - "국가R&D 성과물 기술료의 연구자 보상 비율은 국가연구개발혁신법령 원문과 협약 조건 확인 필요"
  - "기업 규모별 요율(contract_practice.reference_rates_by_scale)은 예시값이며 기관 기준으로 바꾸십시오"

articles:
  invention_report: "발명진흥법 제12조"
  succession_notice: "발명진흥법 제13조, 같은 법 시행령 제7조"
  disposal_compensation: "발명진흥법 제15조, 기관 직무발명 보상 규정"
  exclusive_license_registration: "특허법 제101조"
  tax_free_limit: "소득세법 제12조, 같은 법 시행령 제17조의3"

# 계약 실무 기준 (기관 내부 기준 — 법정 기준 아님, 기관 값으로 바꾸십시오)
contract_practice:
  due_diligence_years: 2
  sales_report_deadline_days: 60
  exclusive_lump_sum_multiplier: 2.5
  exclusive_running_multiplier: 1.5
  reference_rates_by_scale:
    farmer:
      lump_sum: 0
      running_rate: 0.0
      description: "농어업인 참고 요율 (기관 기준 입력)"
    sme:
      lump_sum: 3000000
      running_rate: 0.015
      description: "중소기업 참고 요율 (기관 기준 입력)"
    middle:
      lump_sum: 10000000
      running_rate: 0.025
      description: "중견기업 참고 요율 (기관 기준 입력)"
    large:
      lump_sum: 30000000
      running_rate: 0.04
      description: "대기업 참고 요율 (기관 기준 입력)"

# 직무발명 신고·승계
invention_procedure:
  succession_notice_months: 4          # 발명진흥법 시행령 제7조: 완성 통지를 받은 날부터 4개월 이내
                                       # (예약승계 규정이 있으면 '승계하지 않음'만 통지, 없으면 승계 여부 서면 통지 — 법 제13조)

# 보상금
disposal_compensation:
  payout_ratio: null                   # 기관·사내 보상 규정의 비율. null이면 호출 시 payout_ratio 입력 필요
  deduct_direct_expenses: true         # 보상 기준에서 직접비용을 공제하는지 (규정에 맞게 수정)
  deductible_items:
    - "특허 출원·등록·유지 비용"
    - "기술이전 중개 수수료 및 가치평가 직접비용"

# 직무발명보상금 소득세 (소득세법 — 모든 프로파일 공통)
income_tax:
  tax_free_limit_annual: 7000000
  retired_withholding_rate: 0.22
  local_income_tax_ratio: 0.1
