# 국가법령정보센터 원문 감시 목록
#
# 정책 YAML(kipo_notice_rules.yaml 등)의 기준값이 기대는 법령 조문입니다.
# scripts/check_law_sources.py가 주 1회(GitHub Actions) 현재 시행 원문을 받아
#   1) 버전(공포·시행) 변경,
#   2) 아래 조문 본문의 변경(기준선 legal_baseline.json과 비교),
#   3) phrases 문구가 원문에서 사라졌는지
# 를 확인하고, 바뀐 것이 있으면 law-drift 이슈를 엽니다.
#
# phrases.policy: 그 문구에 기대는 정책 YAML 키 — 문구가 사라지면 이 값부터 다시 확인하십시오.

