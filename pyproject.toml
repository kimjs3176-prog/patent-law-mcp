[project]
name = "patent-law-mcp"
version = "0.2.0"
description = "국가직무발명특허권등 업무 보조 도구 — 지식재산처 국유특허 신고·보상·처분·수탁기관 업무 MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "kimjinseon", email = "kimjs3176@gmail.com" }
]
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0.3",
    "holidays>=0.60",
]

[project.scripts]
patent-law-mcp = "patent_law_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
