[project]
name = "patent-law-mcp"
version = "0.1.0"
description = "특허 분석·검색 및 국가직무발명 처분·기술이전 법령 특화 Model Context Protocol (MCP) 서버"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "kimjinseon", email = "kimjs3176@gmail.com" }
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
patent-law-mcp = "patent_law_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
