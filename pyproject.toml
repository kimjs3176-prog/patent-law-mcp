[project]
name = "patent-law-mcp"
version = "0.2.0"
description = "공공·국유 특허 기술이전 및 국가공무원 등 직무발명 처분·보상 실무 보조 MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "kimjinseon", email = "kimjs3176@gmail.com" }
]
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
patent-law-mcp = "patent_law_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
